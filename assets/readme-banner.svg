<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Passforge</title><desc id="d">A secure password strength meter and random character stream.</desc><defs><linearGradient id="bg"><stop stop-color="#19263d"/><stop offset="1" stop-color="#09111d"/></linearGradient><linearGradient id="g"><stop stop-color="#62e3c1"/><stop offset="1" stop-color="#8fa8ff"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="105" y="100" width="650" height="105" rx="14" fill="#0d1b2c" stroke="#405873" stroke-width="2"/><g fill="#edf3ff" font-family="monospace" font-size="28"><text x="145" y="163">••••••••••••••••</text></g><rect x="810" y="125" width="270" height="18" rx="9" fill="#293c52"/><rect x="810" y="125" width="220" height="18" rx="9" fill="url(#g)"><animate attributeName="width" values="90;220;160;220" dur="4s" repeatCount="indefinite"/></rect><text x="810" y="178" fill="#62e3c1" font-family="monospace" font-size="15">STRENGTH: STRONG</text><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">PASSFORGE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">GENERATE / EVALUATE / PROTECT</text></svg>